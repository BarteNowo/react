<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularz</title>
</head>
<body>
    <form action="/wyslij" method="post">
        <label for="imie_nazwisko">Podaj imię i nazwisko</label>
        <input type="text" id="imie_nazwisko" required />

        <label for="email">Podaj email</label>
        <input type="email" id="email" required />

        <label for="haslo">Podaj haslo</label>
        <input type="password" id="haslo" required minlength="8" />

        <label for="data_urodzenia">Podaj datę urodzenia</label>
        <input type="date" id="data_urodzenia">

        <label for="telefon">Podaj numer telefonu</label>
        <input id="telefon" type="number" pattern="\d{9}">

        <label for="plec">Wybierz plec:</label>
        <select name="plec" id="plec">
            <option value="mez">Mężczyzna</option>
            <option value="kob">Kobieta</option>
        </select>

        <label><input type="checkbox" required />Akceptuję regulamin</label>

        <button type="submit">Zarejestruj się</button>
    </form>
</body>
</html>
