<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="/wyslij" method="post">
        <label for="poziom">Podaj poziom</label>
        <select id="poziom" name="poziom">
            <option value="poczatkujacy">Początkujący</option>
            <option value="sredniozaawansowany">Średniozaawansowany</option>
            <option value="zaawansowany">Zaawansowany</option>
        </select>

        <label for="uwagi">Uwagi do kursu: </label>
        <textarea id="uwagi" rows="4" cols="40">

        <div id="znajomosc">Podaj języki które znasz
            <label for="htmlcss">HTML/CSS</label>
            <input type="checkbox" id="htmlcss">

            <label for="js">JavaScript</label>
            <input type="checkbox" id="js">
            
            <label for="php">PHP</label>
            <input type="checkbox" id="php">
        </div>

        <label for="pin">Podaj PIN dostępy</label>
        <input type="password" id="pin" inputmode="numeric">

        <button id="wyczysc" type="reset">Wyczyść formularz</button>

        <button type="submit">Prześlij formularz</button>
    </form>
</body>
</html>
