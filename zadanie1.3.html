<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularz</title>
</head>
<body>
    <form action="/wyslij" method="post">
        <label for="kod">Podaj kod pocztowy: </label>
        <input type="text" id="kod" pattern="\d{2}-\d{3}" inputmode="numeric" maxlength="6">

        <label for="projekty">Podaj liczbę projektów: </label>
        <input type="number" id="projekty" pattern="[1-10]" required>

        <label for="rabat">Podaj kod rabatowy</label>
        <input id="rabat" type="text" minlength="6" maxlength="10">

        <label for="opis">Podaj opis zamówienia:</label>
        <textarea id="opis"></textarea>

        <label><input type="checkbox" required />Akceptuję regulamin</label>

        <button type="submit">Wyślij zamówienie</button>
    </form>
</body>
</html>
